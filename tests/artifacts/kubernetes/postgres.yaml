apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres-fixture}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-fixture}
  template:
    metadata:
      labels: {app: postgres-fixture}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          env: [{name: POSTGRES_PASSWORD, value: fixture-password}]
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, emptyDir: {}}]
