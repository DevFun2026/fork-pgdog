apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres-fixture}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-fixture}
  template:
    metadata:
      labels: {app: postgres-fixture}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:12.22-bookworm@sha256:2f2a8c2a7d10862e7fba2602e304523554f9df8244c632dafe2628ccb398fb5c
          env: [{name: POSTGRES_PASSWORD, value: fixture-password}]
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432", -U, postgres]}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, emptyDir: {}}]
