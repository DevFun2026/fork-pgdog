image:
  repository: fork-pgdog
  tag: local
  pullPolicy: Never
users:
  existingSecret: pgdog-users
config:
  pgdogToml: |
    [general]
    host = "0.0.0.0"
    port = 6432
    healthcheck_port = 9090
    shutdown_timeout = 120000
    shutdown_termination_timeout = 10000
    [[databases]]
    name = "postgres"
    host = "postgres"
    port = 5432
    role = "primary"
