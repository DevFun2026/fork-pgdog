{{- include "fork-pgdog.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fork-pgdog.fullname" . }}
  labels:
    {{- include "fork-pgdog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "fork-pgdog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fork-pgdog.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.config.pgdogToml .Values.podAnnotations }}
      annotations:
        {{- if .Values.config.pgdogToml }}
        checksum/config: {{ .Values.config.pgdogToml | sha256sum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "fork-pgdog.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- merge (dict "kubernetes.io/os" "linux") .Values.nodeSelector | toYaml | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: configcheck
          image: {{ include "fork-pgdog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/pgdog/config/pgdog.toml", "--users", "/etc/pgdog/users/users.toml", "configcheck"]
          securityContext:
            {{- include "fork-pgdog.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "fork-pgdog.volumeMounts" . | nindent 12 }}
      containers:
        - name: pgdog
          image: {{ include "fork-pgdog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/pgdog/config/pgdog.toml", "--users", "/etc/pgdog/users/users.toml"]
          securityContext:
            {{- include "fork-pgdog.securityContext" . | nindent 12 }}
          ports:
            - name: pgsql
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthcheckPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: pgsql
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: pgsql
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "fork-pgdog.volumeMounts" . | nindent 12 }}
      volumes:
        - name: config
          {{- if .Values.config.existingSecret }}
          secret:
            secretName: {{ .Values.config.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: pgdog.toml
                path: pgdog.toml
          {{- else }}
          configMap:
            name: {{ default (include "fork-pgdog.fullname" .) .Values.config.existingConfigMap | quote }}
            defaultMode: 0444
            items:
              - key: pgdog.toml
                path: pgdog.toml
          {{- end }}
        - name: users
          secret:
            secretName: {{ .Values.users.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: users.toml
                path: users.toml
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
            defaultMode: 0440
        {{- end }}
