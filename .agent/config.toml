[project]
name = "fork-pgdog"
security_profile = "standard"

[commands]
format_check = ["bash", "scripts/pgdog", "cargo", "fmt", "--all", "--", "--check"]
lint = ["bash", "scripts/pgdog", "cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
test_changed = ["bash", "scripts/pgdog", "cargo", "test", "--locked", "-p", "pgdog-config", "-p", "pgdog-vector", "-p", "pgdog-stats", "-p", "pgdog-postgres-types"]
test_full = ["bash", "scripts/verify-pgdog", "full"]
build = ["bash", "scripts/pgdog", "cargo", "build", "--locked", "--workspace"]
smoke = ["applications/pgdog/target/debug/pgdog", "--version"]

[review]
enabled = true
require_independent_provider = true
max_package_bytes = 500000
max_estimated_tokens = 96000
partition_enabled = true
max_aggregate_bytes = 2500000
max_aggregate_tokens = 800000
partition_target_bytes = 250000
provider_order = ["claude", "codex", "gemini"]

[review.provider_commands]
claude = ["claude"]
codex = ["codex"]
gemini = ["agy"]

[documentation]
system_html = "docs/architecture/system.html"

[security]
required_scanners = ["dependency", "license", "sast", "iac", "container"]

[security.scanner_commands]
container = ["python3", "scripts/verify-artifacts", "scan", "--scanner", "container"]
dependency = ["bash", "scripts/pgdog", "cargo", "deny", "--locked", "check", "advisories"]
iac = ["python3", "scripts/verify-artifacts", "scan", "--scanner", "iac"]
license = ["bash", "scripts/pgdog", "cargo", "deny", "--locked", "check", "licenses"]
sast = ["semgrep", "scan", "--json", "--config", "p/rust", "--error", "--strict", "--metrics=off", "--disable-version-check", "--exclude", "target", "--exclude", ".agent", "--exclude", "docs/import", "."]

[security.scanner_version_commands]
container = ["trivy", "--version"]
dependency = ["cargo-deny", "--version"]
iac = ["trivy", "--version"]
license = ["cargo-deny", "--version"]
sast = ["semgrep", "--version"]

[security.scanner_support_paths]
container = ["scripts/artifacts/scan.py", "tests/artifacts/tool-versions.json"]
dependency = ["applications/pgdog/deny.toml"]
iac = ["scripts/artifacts/scan.py", "scripts/artifacts/chart_checks.py", "tests/artifacts/tool-versions.json"]
license = ["applications/pgdog/deny.toml"]
sast = []

[memory]
enabled = true
startup_char_budget = 4000
startup_estimated_token_budget = 1200
local_retention_days = 90
