[project]
name = "fork-pgdog"
security_profile = "standard"

[commands]
format_check = ["cargo", "fmt", "--all", "--", "--check"]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
test_changed = ["cargo", "test", "--locked", "-p", "pgdog-config", "-p", "pgdog-vector", "-p", "pgdog-stats", "-p", "pgdog-postgres-types"]
test_full = ["bash", "scripts/verify-pgdog", "full"]
build = ["cargo", "build", "--locked", "--workspace"]
smoke = ["target/debug/pgdog", "--version"]

[review]
enabled = true
require_independent_provider = true
max_package_bytes = 500000
max_estimated_tokens = 64000
provider_order = ["claude", "codex", "gemini"]

[review.provider_commands]
claude = ["claude"]
codex = ["codex"]
gemini = ["agy"]

[documentation]
system_html = "docs/architecture/system.html"

[security]
required_scanners = ["dependency", "license", "sast"]

[security.scanner_commands]
container = []
dependency = ["cargo", "deny", "--locked", "check", "advisories"]
iac = []
license = ["cargo", "deny", "--locked", "check", "licenses"]
sast = ["semgrep", "scan", "--json", "--config", "p/rust", "--error", "--strict", "--metrics=off", "--disable-version-check", "--exclude", "target", "--exclude", ".agent", "--exclude", "docs/import", "."]

[security.scanner_version_commands]
container = []
dependency = ["cargo-deny", "--version"]
iac = []
license = ["cargo-deny", "--version"]
sast = ["semgrep", "--version"]

[security.scanner_support_paths]
container = []
dependency = ["deny.toml"]
iac = []
license = ["deny.toml"]
sast = []

[memory]
enabled = true
startup_char_budget = 4000
startup_estimated_token_budget = 1200
local_retention_days = 90
