[[environments]]
id = "github-actions"
name = "GitHub Actions"
description = "Pull-request or manual validation only; publishing is manual. GitHub-hosted Ubuntu 24.04 Rust/unit/integration CI and template runtime tests. Independent review needs approved local evidence; upstream-only Codecov and Bencher credentials are not required."

[[environments]]
id = "gitlab-ci"
name = "GitLab CI"
description = "Merge-request or manual web pipelines only. Python 3.11 jobs invoke the same runtime commands and retain redacted failure evidence."

[[environments]]
id = "local"
name = "Local developer environment"
description = "macOS with sandbox-exec or Linux/WSL with Bubblewrap, Python 3.11+, and optional authenticated provider CLIs."

[[environments]]
id = "github-pages"
name = "GitHub Pages"
description = "Public static architecture reference at https://devfun2026.github.io/fork-pgdog/. The architecture-pages workflow validates on PRs and publishes only after manual dispatch from main. It uploads only index.html and .nojekyll, not repository files or local evidence. First publication requires Actions-based Pages setup and a protected github-pages environment. This host has no database access or LLM runtime."

[[environments]]
id = "kubernetes"
name = "Operator Kubernetes"
description = "Helm 3.8+/Kubernetes 1.28+ stable API target. Local Kind 0.33.0/Kubernetes 1.36.4 smoke with Helm 4.1.3 is verified; pinned Helm 3.19.0/native amd64+arm64 CI is authored and requires an actual run. Production network/TLS/Secret policy and durable 2PC storage remain external."

[[environments]]
id = "ghcr"
name = "GHCR packages environment"
description = "Manual main-only package workflow consumes owner-approved genuine release receipt, source ancestry and new versions. Protected packages environment reviewers gate writes/OIDC. Registry visibility and first publication are separately authorized external setup; no release clearance is claimed without signed security evidence."
