[[environments]]
id = "github-actions"
name = "GitHub Actions"
description = "GitHub-hosted Ubuntu 24.04 Rust/unit/integration CI and template runtime tests. Independent review needs approved local evidence; upstream-only Codecov and Bencher credentials are not required."

[[environments]]
id = "gitlab-ci"
name = "GitLab CI"
description = "Python 3.11 jobs invoke the same runtime commands and retain redacted failure evidence."

[[environments]]
id = "local"
name = "Local developer environment"
description = "macOS with sandbox-exec or Linux/WSL with Bubblewrap, Python 3.11+, and optional authenticated provider CLIs."
