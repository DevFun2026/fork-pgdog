title = "PgDog fork: system architecture"
purpose = "Fork of PgDog (https://github.com/pgdogdev/pgdog), reusing the PostgreSQL proxy to add an LLM agent layer. PgDog is the current runtime; the LLM agent and the EKS audit deployment are planned. This reference covers implemented components, database traffic, repository quality gates and documentation publishing."
data_categories = ["configuration", "evidence-metadata", "memory-record", "project-source", "review-package", "sql-query", "database-credentials", "query-results"]
sensitive_categories = ["project-source", "review-package", "sql-query", "database-credentials", "query-results"]

[[components]]
id = "canonical-core"
name = "Canonical Agent Core"
kind = "policy-and-skills"
responsibility = "Defines provider-neutral policy, 21 core skills and four task-routed UX/UI skills, schemas, artifact templates, and lifecycle contracts. UX/UI references are read per phase and retain source notices; no external skill runtime is installed."
trust_boundary = "local-repository"

[[components]]
id = "ci-wrappers"
name = "CI Wrappers"
kind = "automation"
responsibility = "Invokes repository-owned PR/manual quality gates, native image/chart validation and isolated Kubernetes smoke. Artifact writes require reviewed receipt and protected packages approval. An explicit first 0.1.0 release exception binds the approved owner comment, historical source review, current workflow review and successful GitHub CI; it never claims SSH clearance."
trust_boundary = "hosted-ci"

[[components]]
id = "release-owner"
name = "GitHub Release Owner"
kind = "human-reviewer"
responsibility = "Owns the bounded first-release decision recorded in PR #7 comment 5948092075. Numeric GitHub identity, unchanged comment, current admin permission and required packages reviewer are validated before publication and after environment approval."
trust_boundary = "authenticated-github-owner"

[[components]]
id = "docs-generator"
name = "Documentation Generator"
kind = "generator"
responsibility = "Validates the canonical project model and generates deterministic architecture views."
trust_boundary = "local-repository"

[[components]]
id = "project-memory"
name = "Project Memory"
kind = "local-storage"
responsibility = "Stores private candidates locally; retrieves fresh canonical summaries with ranked top-k and bounded context."
trust_boundary = "local-repository"

[[components]]
id = "provider-adapters"
name = "Provider Adapters"
kind = "adapter"
responsibility = "Shares generated skills across Claude, Codex, and Gemini via agy; runs bounded review packages inside a fail-closed OS read sandbox. AGY pins a Gemini model, validates terminal schema output, and uses disposable API-key-mode settings without host profiles."
trust_boundary = "provider-cli-process"

[[components]]
id = "review-engine"
name = "Cross-Review Engine"
kind = "orchestrator"
responsibility = "Builds budgeted review packages with proven generated-copy deduplication, verified unchanged-rename path tables and full Git change binding. Recomputes blob/mode proofs before egress; changed sensitive files stay blocked. Enforces reviewer independence and validates findings."
trust_boundary = "local-repository"

[[components]]
id = "runtime"
name = "Agent Runtime"
kind = "python-cli"
responsibility = "Runs configuration, evidence, workflow, documentation, review, security, and release commands."
trust_boundary = "local-repository"

[[components]]
id = "pgdog-proxy"
name = "PgDog Proxy"
kind = "rust-service"
responsibility = "Contains the application workspace at applications/pgdog/ and implements PostgreSQL protocol handling, authentication, pooling, routing, and SQL execution forwarding. Existing upstream behavior; no production deployment configured by this import."
trust_boundary = "proxy-process"

[[components]]
id = "postgresql"
name = "PostgreSQL"
kind = "database"
responsibility = "Executes forwarded queries. Verification uses isolated PostgreSQL 18 fixtures; production infrastructure is outside this repository setup."
trust_boundary = "database-process"

[[components]]
id = "sql-client"
name = "PostgreSQL Client"
kind = "client"
responsibility = "Sends PostgreSQL protocol messages and credentials; integration tests use synthetic users and data."
trust_boundary = "client-process"

[[components]]
id = "container-builder"
name = "Fork Container Builder"
kind = "build-tooling"
responsibility = "Builds applications/pgdog/Dockerfile from pinned Ubuntu/Rust bases with Cargo.lock and plugin; excludes Git/private context. Produces native OCI archives verified before publication."
trust_boundary = "hosted-ci"

[[components]]
id = "artifact-registry"
name = "Owned GHCR Artifacts"
kind = "registry"
responsibility = "Destination ghcr.io/devfun2026/fork-pgdog and charts/fork-pgdog. Stores versioned images/chart paired by digest after authorized manual publication; first external publication remains unverified."
trust_boundary = "external-registry"

[[components]]
id = "helm-release"
name = "Fork Helm Release"
kind = "deployment-tooling"
responsibility = "Standalone charts/fork-pgdog creates a stateless Linux Deployment, configcheck initContainer, PostgreSQL-only Service and token-disabled ServiceAccount. No database or durable 2PC WAL provisioned."
trust_boundary = "operator-to-cluster"

[[components]]
id = "kubernetes-pod"
name = "Hardened PgDog Pod"
kind = "container-runtime"
responsibility = "Runs UID/GID 10001 with read-only root/mounts, bounded tmp, TCP liveness and backend-aware HTTP readiness, and image SIGINT with bounded drain. Verified locally in isolated Kind; production infrastructure remains operator-owned."
trust_boundary = "cluster-workload"

[[components]]
id = "operator-secrets"
name = "Operator Configuration and Secrets"
kind = "external-configuration"
responsibility = "Provides pgdog.toml via one inline/existing ConfigMap/Secret source, required existing users.toml Secret and optional TLS files. External changes/restoration require explicit operator rollout and version management."
trust_boundary = "cluster-secret-store"
