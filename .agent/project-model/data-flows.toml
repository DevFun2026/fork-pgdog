[[data_flows]]
id = "ci-evidence"
source = "ci-wrappers"
target = "runtime"
data_categories = ["configuration", "evidence-metadata"]
trust_boundary = "hosted-ci-to-repository"

[[data_flows]]
id = "documentation-model"
source = "canonical-core"
target = "docs-generator"
data_categories = ["configuration"]
trust_boundary = "local-repository"

[[data_flows]]
id = "memory-checkpoint"
source = "runtime"
target = "project-memory"
data_categories = ["memory-record"]
trust_boundary = "local-private-storage"

[[data_flows]]
id = "review-egress"
source = "review-engine"
target = "provider-adapters"
data_categories = ["project-source", "review-package"]
trust_boundary = "local-to-provider-process"

[[data_flows]]
id = "client-query"
source = "sql-client"
target = "pgdog-proxy"
data_categories = ["sql-query", "database-credentials"]
trust_boundary = "client-to-proxy"

[[data_flows]]
id = "backend-query"
source = "pgdog-proxy"
target = "postgresql"
data_categories = ["sql-query", "database-credentials"]
trust_boundary = "proxy-to-database"

[[data_flows]]
id = "backend-results"
source = "postgresql"
target = "pgdog-proxy"
data_categories = ["query-results"]
trust_boundary = "database-to-proxy"

[[data_flows]]
id = "client-results"
source = "pgdog-proxy"
target = "sql-client"
data_categories = ["query-results"]
trust_boundary = "proxy-to-client"
