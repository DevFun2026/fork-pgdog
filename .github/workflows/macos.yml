name: macos
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/macos.yml"
      - "applications/pgdog/**/*.rs"
      - "applications/pgdog/integration/**"

defaults:
  run:
    working-directory: applications/pgdog

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: applications/pgdog -> target
      - name: Build
        run: cargo build
