name: macos
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/macos.yml"
      - "**/*.rs"
      - "integration/**"

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
