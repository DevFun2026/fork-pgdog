# Fork version of Bencher (Step 2 of 2)
#
# We built the image in bencher_fork_run.yml on the fork PR.
# Now, we can use it (ON THE MAIN BRANCH, where it's okay to use secrets),
# and basically do what we do in the main Bencher workflow, with a pre-built image this time.

name: bencher-fork-track
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful bencher-fork-run workflow run ID
        required: true
        type: string
      head_sha:
        description: Commit SHA built by that run
        required: true
        type: string
env:
  IMAGE: registry.bencher.dev/pgdog:${{ inputs.head_sha }}

jobs:
  image:
    # Download image from previous workflow (2-step). Push image to bencher.
    if: github.repository == 'pgdogdev/pgdog'
    permissions:
      actions: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Validate selected benchmark run
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.RUN_ID) || !/^[a-f0-9]{40}$/.test(process.env.HEAD_SHA)) {
              throw new Error('Invalid run ID or commit SHA');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.RUN_ID)
            });
            if (run.conclusion !== 'success' || run.head_sha !== process.env.HEAD_SHA ||
                run.path !== '.github/workflows/bencher_fork_run.yml' || run.event !== 'pull_request' ||
                run.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Expected a successful fork pull-request benchmark run at the selected SHA');
            }
      - uses: actions/download-artifact@v4
        with:
          name: image
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker load < image.tar.gz
          docker tag pgdog-bench $IMAGE
          echo '${{ secrets.BENCHER_API_KEY }}' | docker login registry.bencher.dev -u pgdog --password-stdin
          docker push $IMAGE

  bench:
    needs: image
    permissions:
      actions: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        suite: [pooler, lb, sharding]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: event.json
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Since we're running this on main branch, we have to download the artifact
      # from the PR that requested this run to figure out which one it was,
      # so that we can safely run this on main and have all the required info.
      - name: Export PR event data
        run: |
          echo "PR_HEAD=$(jq -r .pull_request.head.ref event.json)" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=$(jq -r .pull_request.head.sha event.json)" >> "$GITHUB_ENV"
          echo "PR_BASE=$(jq -r .pull_request.base.ref event.json)" >> "$GITHUB_ENV"
          echo "PR_BASE_SHA=$(jq -r .pull_request.base.sha event.json)" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$(jq -r .number event.json)" >> "$GITHUB_ENV"
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a
      - name: Run ${{ matrix.suite }} on Bencher bare metal
        # This will run one test per job (all in parallel).
        # It'll error if a test's throughput is more than 3% BELOW the mean of the baseline's previous runs (main)
        #
        # After testing 5x back-to-back, variance was <1%. This should be enough
        # of a difference, unless something goes on with their servers in the future.
        #
        # TODO: we can re-evaluate a proper variance later
        #
        # Why --github-actions? This allows it to comment on the PR with the result.
        # Why --adapter json? This allows us to use a 'custom harness'; basically nothing like rust's cargo test / criterion, we're running custom scripts
        # Results are collected manually with bencher_followup.yml after the detached run.
        run: |
          bencher run \
            --project pgdog \
            --key '${{ secrets.BENCHER_API_KEY }}' \
            --branch "$PR_HEAD" \
            --hash "$PR_HEAD_SHA" \
            --start-point "$PR_BASE" \
            --start-point-hash "$PR_BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --spec intel-v1 \
            --threshold-measure throughput \
            --threshold-test percentage \
            --threshold-lower-boundary 0.03 \
            --thresholds-reset \
            --error-on-alert \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --ci-number "$PR_NUMBER" \
            --ci-id ${{ matrix.suite }} \
            --ci-only-on-alert \
            --adapter json \
            --image $IMAGE \
            --detach \
            --ci-callback-token '${{ secrets.BENCHER_GITHUB_TOKEN }}' \
            "bash benches/perf/bencher.sh ${{ matrix.suite }}"
