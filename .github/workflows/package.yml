name: Publish fork image and OCI chart
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Owner-reviewed full source SHA reachable from main
        required: true
        type: string
      image_version:
        description: New exact image SemVer without v prefix
        required: true
        type: string
      chart_version:
        description: New exact chart SemVer without v prefix
        required: true
        type: string
      receipt_json:
        description: Genuine signed-release receipt or explicitly approved first-release owner-exception receipt JSON
        required: true
        type: string
      receipt_sha256:
        description: Owner-approved canonical receipt SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fork-artifact-publication
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  IMAGE_VERSION: ${{ inputs.image_version }}
  CHART_VERSION: ${{ inputs.chart_version }}
  RECEIPT_JSON: ${{ inputs.receipt_json }}
  RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --requirement tests/artifacts/requirements.txt
      - name: Validate approved receipt and source ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"receipt.json").write_text(os.environ["RECEIPT_JSON"])'
          python3 scripts/verify-artifacts publish-preflight --receipt "$RUNNER_TEMP/receipt.json" --receipt-sha256 "$RECEIPT_SHA256" --source-sha "$SOURCE_SHA" --image-version "$IMAGE_VERSION" --chart-version "$CHART_VERSION"
      - name: Require owner reviewers on publish environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api repos/DevFun2026/fork-pgdog/environments/packages --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$reviewers" -gt 0
      - name: Require authenticated absence of immutable tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-artifacts registry-absent --name devfun2026/fork-pgdog --tag "$IMAGE_VERSION"
          python3 scripts/verify-artifacts registry-absent --name devfun2026/fork-pgdog --tag "$SOURCE_SHA"
          python3 scripts/verify-artifacts registry-absent --name devfun2026/charts/fork-pgdog --tag "$CHART_VERSION"
  build:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      PGDOG_TEST_TOOLCHAIN: 1.96.1
      ARTIFACT_ARCH: ${{ matrix.arch }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare artifact tools
        run: |
          python3 -m pip install --requirement tests/artifacts/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo --version | grep -E '^skopeo version 1\.13\.3$'
          python3 scripts/install-artifact-tools --directory "$RUNNER_TEMP/artifact-bin"
          echo "$RUNNER_TEMP/artifact-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - run: rustup toolchain install 1.96.1 --profile minimal
      - name: Build and verify exact publishable OCI bytes
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/fork-artifacts-${{ matrix.arch }}
        run: bash scripts/build-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fork-native-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/fork-artifacts-${{ matrix.arch }}/image-${{ matrix.arch }}.tar
            ${{ runner.temp }}/fork-artifacts-${{ matrix.arch }}/image-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    needs: [preflight, build]
    environment: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare artifact tools
        run: |
          python3 -m pip install --requirement tests/artifacts/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo --version | grep -E '^skopeo version 1\.13\.3$'
          python3 scripts/install-artifact-tools --directory "$RUNNER_TEMP/artifact-bin"
          echo "$RUNNER_TEMP/artifact-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fork-native-*
          path: ${{ runner.temp }}/fork-publish
          merge-multiple: true
      - name: Revalidate receipt after owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"receipt.json").write_text(os.environ["RECEIPT_JSON"])'
          python3 scripts/verify-artifacts publish-preflight --receipt "$RUNNER_TEMP/receipt.json" --receipt-sha256 "$RECEIPT_SHA256" --source-sha "$SOURCE_SHA" --image-version "$IMAGE_VERSION" --chart-version "$CHART_VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy tested archives and publish paired image manifest
        id: images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-artifacts images --directory "$RUNNER_TEMP/fork-publish"
      - uses: ./.github/actions/sign-and-attest-image
        with:
          image: ghcr.io/devfun2026/fork-pgdog@${{ steps.images.outputs.amd64 }}
          source-sha: ${{ inputs.source_sha }}
      - uses: ./.github/actions/sign-and-attest-image
        with:
          image: ghcr.io/devfun2026/fork-pgdog@${{ steps.images.outputs.arm64 }}
          source-sha: ${{ inputs.source_sha }}
      - uses: ./.github/actions/sign-and-attest-image
        with:
          image: ghcr.io/devfun2026/fork-pgdog@${{ steps.images.outputs.combined }}
          source-sha: ${{ inputs.source_sha }}
      - name: Publish digest-pinned chart last and pull it back
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.images.outputs.combined }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/publish-artifacts chart --image-digest "$IMAGE_DIGEST"
