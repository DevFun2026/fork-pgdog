name: Architecture Pages
on:
  pull_request:
    paths:
      - '.agent/runtime/agent_cli/docs*.py'
      - '.agent/templates/docs/**'
      - '.agent/project-model/**'
      - '.agent/tests/test_docs.py'
      - 'docs/**'
      - '.github/workflows/architecture-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: architecture-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject manual publication from other branches
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Architecture Pages must be dispatched from main.' >&2
          exit 1
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify renderer and committed documentation
        run: |
          PYTHONPATH=.agent/runtime python3 -m unittest discover -s .agent/tests -p test_docs.py -v
          ./scripts/agent docs check
      - name: Build current revision
        run: |
          ./scripts/agent docs build
          ./scripts/agent docs check
          mkdir -p "$RUNNER_TEMP/architecture-pages"
          cp docs/architecture/system.html "$RUNNER_TEMP/architecture-pages/index.html"
          touch "$RUNNER_TEMP/architecture-pages/.nojekyll"
      - name: Upload only the public architecture document
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/architecture-pages
          retention-days: 1
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy architecture
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
